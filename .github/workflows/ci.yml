name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true   # 视频素材由 Git LFS 托管，需显式拉取，避免拿到指针文件

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 运行单元测试
        run: pytest -v --cov=server --cov-report=term-missing

      - name: 校验服务端语法
        run: python -m compileall -q server

  lint:
    name: 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装检查工具
        run: pip install ruff

      - name: Ruff 静态检查
        run: ruff check server tests --output-format=github

  frontend:
    name: 前端构建与冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规范检查
        run: npm run lint

      - name: 类型检查与构建
        run: npm run build

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行冒烟测试
        run: npm run test:e2e

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
