<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>元素幻语</title>
    
    <link rel="stylesheet" href="assets/css/mobile-adaptation.css">
    
    <link rel="stylesheet" href="assets/css/home.css?v=20261116j">
    <link rel="stylesheet" href="assets/css/ai-assistant.css?v=20261115c">
</head>
<body class="video-poster">

<!--背景层（视频 + 遮罩 + 粒子）-->
<div class="video-container">
    <video autoplay loop muted playsinline playsinline="true" webkit-playsinline="true" x5-playsinline="true" x5-video-player-type="h5-page" x5-video-player-fullscreen="false" x5-video-orientation="portrait" disablepictureinpicture preload="auto" id="bgVideo" poster="assets/background-poster.jpg">
        <source src="./assets/background.mp4?v=20261116a" type="video/mp4">
    </video>
</div>
<div class="overlay"></div>
<canvas id="particle-canvas"></canvas>

<!--主内容区域-->
<div class="content">
    <h1 class="title">元素幻语</h1>
    <div class="subtitle">✨ 无人之地 · 灵音启程 ✨</div>
    <div class="description">
        流光倾泻，星河为幕；元素于指尖苏醒，<br>在三维时空里律动成诗。全屏视频将你拉入浩瀚，
        <br>3D周期表让微观宇宙触手可及——科学与诗意在此交融，每一次滑动，都是与万物之灵的对话。
    </div>
    
    <div class="btn-group" id="nav-app"></div>
    <div class="scroll-hint">⬇ 向下滚动 · 灵语画廊 ⬇</div>
</div>


<!-- 第一个下拉页面：灵语画廊 -->
<section class="gallery-section" id="spiritGallery">
    <div class="carousel-container">
        <div class="gallery-subtle">✦ 化学先驱 ✦</div>
        <div class="cards-wrapper" id="galleryCardsWrapper"></div>
        <div class="nav-arrow arrow-left" id="galleryPrevBtn">‹</div>
        <div class="nav-arrow arrow-right" id="galleryNextBtn">›</div>
    </div>
</section>



<!-- 第二个下拉页面：双轨胶片 -->
<section class="film-gallery-section" id="filmStripSection">
    <div class="film-header">
        ✦ 元素幻廊 · 光影诗篇 ✦
        <p>｜          ｜                                                       ｜          ｜</p>
    </div>
    <div class="track track-up" id="trackUp">
        <div class="film-scroll" id="scrollUpWrapper">
            <div class="film-rail" id="filmRailUp"></div>
        </div>
    </div>
    <div class="track track-down" id="trackDown">
        <div class="film-scroll" id="scrollDownWrapper">
            <div class="film-rail" id="filmRailDown"></div>
        </div>
    </div>
</section>

<!--唱片控件-->
<div class="vinyl-player" id="vinylPlayer">
    <div class="vinyl-disc" id="vinylDisc">
        <div class="vinyl-label">♫</div>
    </div>
</div>

<!--AI小助手（小幻语）：Vue 3 管理状态与交互-->
<div id="assistant-app"></div>

<!--背景音乐-->
<audio id="bgMusic" loop preload="auto">
    <source src="./assets/无人之地.mp3" type="audio/mpeg">
</audio>

    <script src="assets/js/home.js?v=20261117b"></script>
    <!-- Vite + Vue 3 + TypeScript 构建产物，源码见 src/ -->
    <script type="module" src="./assets/dist/main.js"></script>
</body>
</html>
